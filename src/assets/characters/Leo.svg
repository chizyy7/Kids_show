<svg width="120" height="140" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <ellipse cx="60" cy="95" rx="45" ry="35" fill="#FFCC00"/>
  <!-- Head -->
  <circle cx="60" cy="50" r="30" fill="#FFCC00"/>
  <!-- Ears -->
  <path d="M45,20 Q40,0 50,20" fill="#FFCC00"/>
  <path d="M75,20 Q80,0 85,20" fill="#FFCC00"/>
  <!-- Mane -->
  <path d="M35,40 Q25,25 45,35 Q55,15 75,35 Q85,25 65,40 Z" fill="#FFA500"/>
  <!-- Eyes -->
  <circle cx="48" cy="42" r="4" fill="white"/>
  <circle cx="72" cy="42" r="4" fill="white"/>
  <circle cx="48" cy="42" r="2" fill="black"/>
  <circle cx="72" cy="42" r="2" fill="black"/>
  <!-- Eyebrows -->
  <path d="M42,36 Q48,30 54,36" stroke="#FFCC00" stroke-width="2" fill="none"/>
  <path d="M66,36 Q72,30 78,36" stroke="#FFCC00" stroke-width="2" fill="none"/>
  <!-- Nose -->
  <triangle points="58,55 62,55 60,60" fill="black"/>
  <!-- Mouth -->
  <path d="M52,65 Q60,75 68,65" stroke="black" stroke-width="2" fill="none"/>
  <!-- Cheeks -->
  <circle cx="45" cy="60" r="3" fill="#FFB6C1"/>
  <circle cx="75" cy="60" r="3" fill="#FFB6C1"/>
  <!-- Legs -->
  <rect x="35" y="115" width="12" height="25" fill="#FFCC00"/>
  <rect x="73" y="115" width="12" height="25" fill="#FFCC00"/>
  <!-- Tail -->
  <path d="M95,85 Q105,75 110,85" stroke="#FFCC00" stroke-width="6" fill="none"/>
  <!-- Heart on chest (optional, for expressiveness) -->
  <path d="M60,80 Q58,78 60,82 Q62,78 60,80 Z" fill="#FF69B4" opacity="0.0"/>
</svg>
