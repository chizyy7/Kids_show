<svg width="120" height="140" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <ellipse cx="60" cy="95" rx="35" ry="30" fill="#FFB6C1"/>
  <!-- Head -->
  <circle cx="60" cy="50" r="25" fill="#FFB6C1"/>
  <!-- Ears -->
  <ellipse cx="45" cy="20" rx="12" ry="30" fill="#FFB6C1"/>
  <ellipse cx="75" cy="20" rx="12" ry="30" fill="#FFB6C1"/>
  <!-- Inner ear -->
  <ellipse cx="45" cy="20" rx="8" ry="20" fill="#FF69B4"/>
  <ellipse cx="75" cy="20" rx="8" ry="20" fill="#FF69B4"/>
  <!-- Eyes -->
  <circle cx="50" cy="45" r="3" fill="white"/>
  <circle cx="70" cy="45" r="3" fill="white"/>
  <circle cx="50" cy="45" r="1.5" fill="black"/>
  <circle cx="70" cy="45" r="1.5" fill="black"/>
  <!-- Eyebrows -->
  <path d="M44,38 Q50,32 56,38" stroke="#FFB6C1" stroke-width="1.5" fill="none"/>
  <path d="M64,38 Q70,32 76,38" stroke="#FFB6C1" stroke-width="1.5" fill="none"/>
  <!-- Nose -->
  <circle cx="60" cy="55" r="2" fill="black"/>
  <!-- Mouth -->
  <path d="M50,62 Q60,70 70,62" stroke="black" stroke-width="1.5" fill="none"/>
  <!-- Whiskers -->
  <line x1="48" y1="58" x2="38" y2="58" stroke="black" stroke-width="0.5"/>
  <line x1="52" y1="58" x2="42" y2="58" stroke="black" stroke-width="0.5"/>
  <line x1="68" y1="58" x2="78" y2="58" stroke="black" stroke-width="0.5"/>
  <line x1="72" y1="58" x2="82" y2="58" stroke="black" stroke-width="0.5"/>
  <!-- Legs -->
  <rect x="40" y="115" width="12" height="25" fill="#FFB6C1"/>
  <rect x="68" y="115" width="12" height="25" fill="#FFB6C1"/>
  <!-- Tail -->
  <circle cx="95" cy="85" r="8" fill="#FFB6C1"/>
</svg>
